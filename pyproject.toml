[project]
name = "matchmycv"
version = "0.1.0"
description = "MatchMyCV — AI resume tailoring agent: LangGraph workflow, Groq via LangChain, Pydantic outputs, FastAPI UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "jinja2>=3.1.6",
    "langchain-core>=1.6.10",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.15",
    "pydantic>=2.11",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.0.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "reportlab>=5.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls the real Groq API (run with RUN_LIVE=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"
