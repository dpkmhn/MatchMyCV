      - { terms: [Tableau, Power BI], status: met, must: true }
      - { terms: [Python, R], status: met, must: true }
      - { terms: [A/B, A/B tests, A/B testing, experiment, experiments], status: met, must: true }
      - { terms: [communication, stakeholder, stakeholders, presenting], status: met, must: true }
      - { terms: [dbt], status: met, must: false }
      - { terms: [Snowflake], status: met, must: false }
      - { terms: [retail, e-commerce], status: met, must: false }
