      - { terms: [LangChain, LangGraph], status: missing }
      - { terms: [vector database, vector databases, pgvector, Pinecone, FAISS], status: missing }
      - { terms: [FastAPI, REST], status: [missing, partial] }
      - { terms: [Docker], status: missing }
      - { terms: [CI/CD], status: [missing, partial] }
      - { terms: [AWS, GCP, Azure, cloud], status: missing }
      - { terms: [LangSmith, evaluation], status: missing }
      - { terms: [Kubernetes], status: missing }
      - { terms: [insurance, fintech], status: [missing, partial] }
      - { terms: [Pydantic, structured outputs], status: missing }
