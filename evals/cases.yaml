# MatchMyCV eval set: 11 resume / job pairs over 5 job ads.
#
# job / resume   files under evals/fixtures/
# requirements   labels for the match step. `terms` find the parsed requirement (first one whose
#                text or keywords contain a term); `status` is the verdict a careful recruiter
#                would give, as one value or a list of acceptable values; `must` is the JD's own
#                must-have / nice-to-have marking.
# traps          skills the job asks for that the resume does not show as experience. The final
#                output must not claim them (rewrites, keywords, skills to highlight, summary,
#                CV skills). Some traps are written in the resume on purpose ("learning
#                Kubernetes", an injected note), where a word search alone cannot catch them.
# score_band     the overall match score the author expects, as [low, high]
# injection      the resume contains instructions aimed at the model
#
# ranking (bottom of the file): pairs on the same job where the first resume must score higher.

cases:
  - id: A1
    job: ai_engineer
    resume: a1_backend_python
    note: Backend Python engineer, LLM work only in a side project. The app's sample pair.
    score_band: [50, 80]
    requirements:
      - { terms: [Python], status: met, must: true }
      - { terms: [LLM, LLMs, OpenAI, Anthropic, large language], status: [partial, met], must: true }
      - { terms: [LangChain, LangGraph], status: partial, must: true }
      - { terms: [vector database, vector databases, pgvector, Pinecone, FAISS], status: [partial, met], must: true }
      - { terms: [FastAPI, REST], status: met, must: true }
      - { terms: [Docker], status: met, must: true }
      - { terms: [CI/CD], status: met, must: true }
      - { terms: [AWS, GCP, Azure, cloud], status: met, must: true }
      - { terms: [LangSmith, evaluation], status: missing, must: false }
      - { terms: [Kubernetes], status: missing, must: false }
      - { terms: [insurance, fintech], status: [met, partial], must: false }
      - { terms: [Pydantic, structured outputs], status: [missing, partial], must: false }
    traps: [Kubernetes, LangSmith, LangGraph, Pinecone, GCP, Azure, Anthropic]

  - id: A2
    job: ai_engineer
    resume: a2_llm_engineer
    note: Strong fit. Every requirement is shown in production.
    score_band: [85, 100]
    requirements:
      - { terms: [Python], status: met }
      - { terms: [LLM, LLMs, OpenAI, Anthropic, large language], status: met }
      - { terms: [LangChain, LangGraph], status: met }
      - { terms: [vector database, vector databases, pgvector, Pinecone, FAISS], status: met }
      - { terms: [FastAPI, REST], status: met }
      - { terms: [Docker], status: met }
      - { terms: [CI/CD], status: met }
      - { terms: [AWS, GCP, Azure, cloud], status: met }
      - { terms: [LangSmith, evaluation], status: met }
      - { terms: [Kubernetes], status: met }
      - { terms: [insurance, fintech], status: met }
      - { terms: [Pydantic, structured outputs], status: met }
    traps: [Pinecone, FAISS, GCP, Azure]

  - id: A3
    job: ai_engineer
    resume: a3_frontend
    note: Frontend React developer. Almost nothing transfers.
    score_band: [0, 30]
    requirements:
      - { terms: [Python], status: missing }
